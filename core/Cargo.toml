[package]
name = "tomoshibi-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# The protocol crate holds everything that is logic rather than media: the
# deployment's API, the in-call protocols, the lossless codec. It does not link
# WebRTC, so it builds and tests in seconds and can be worked on in parallel.
[workspace]
members = [".", "protocol"]
exclude = ["vendor"]

[lib]
# A static library for the Apple apps to link, and an ordinary one for the
# examples and for the binding generator to read.
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
tomoshibi-protocol = { path = "protocol" }
uniffi = { version = "0.32", features = ["cli"] }
# Both sets of roots. The native set is read by rustls-native-certs, which on
# iOS takes its Linux path and looks for files under /etc/ssl that an iPhone
# does not have: it finds nothing, tokio-tungstenite refuses to connect with no
# roots at all, and every join on an iPhone failed at the media server after
# the server had said yes. With the bundled Mozilla set beside it an empty
# native set is not fatal (tokio-tungstenite tls.rs), so iOS trusts what the
# web requests already trust (reqwest's rustls-tls is the same bundled set)
# and the Mac keeps its keychain's roots as well.
livekit = { version = "=0.9.5", default-features = false, features = ["native", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
thiserror = "2"

# The same JNI crate libwebrtc's Android initialisation takes its JavaVM from.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Two LiveKit crates carry small changes this project needs, each marked
# "Tomoshibi:" where it is made. See vendor/README.md.
[patch.crates-io]
livekit = { path = "vendor/livekit" }
livekit-signaling = { path = "vendor/livekit-signaling" }
libwebrtc = { path = "vendor/libwebrtc" }

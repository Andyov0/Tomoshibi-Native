[package]
name = "tomoshibi-protocol"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
uniffi = { version = "0.32" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
base64 = "0.22"
rand = "0.9"
futures-util = "0.3"
# SHA-256 for a downloaded update (api/updates.rs). Already in the tree as
# rustls's cryptography, so a hash costs no crate that was not built anyway.
ring = "0.17"

[dev-dependencies]

# XcodeGen describes the project; the .xcodeproj is generated and not kept.
#   cd apple && xcodegen
name: Tomoshibi
options:
  bundleIdPrefix: app.tomoshibi
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  TomoshibiCore:
    path: TomoshibiCore
  TomoshibiKit:
    path: TomoshibiKit
settings:
  base:
    DEVELOPMENT_TEAM: SM86NB3CPZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    OTHER_LDFLAGS: ["-ObjC"]
    # The core is built for Apple silicon only (the Mac, phones, and the
    # simulator on Apple silicon); an Intel simulator slice does not exist.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Tomoshibi-macOS:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TomoshibiKit
    info:
      path: build/Info-macOS.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        # From the build settings, so the version is said in one place: left
        # out, XcodeGen wrote 1.0 (1) whatever MARKETING_VERSION said, and an
        # extension whose version differs from its app's is refused upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The four languages the interface is written in, declared so the
        # system offers a per-app language for Tomoshibi in its settings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        NSMicrophoneUsageDescription: Tomoshibi uses the microphone so that others in a call can hear you.
        NSCameraUsageDescription: Tomoshibi uses the camera so that others in a call can see you.
        CFBundleURLTypes:
          - CFBundleURLName: app.tomoshibi.link
            CFBundleURLSchemes: [tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.mac
        PRODUCT_NAME: Tomoshibi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Tomoshibi-iOS:
    type: application
    platform: iOS
    scheme:
      testTargets: [TomoshibiUITests]
    sources: [App]
    dependencies:
      - package: TomoshibiKit
      - target: Tomoshibi-Broadcast
    info:
      path: build/Info-iOS.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        # From the build settings, so the version is said in one place: left
        # out, XcodeGen wrote 1.0 (1) whatever MARKETING_VERSION said, and an
        # extension whose version differs from its app's is refused upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The four languages the interface is written in, declared so the
        # system offers a per-app language for Tomoshibi in its settings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        UILaunchScreen: {}
        # The export compliance answer, given once in App Store Connect for
        # build 1: standard algorithms only (TLS, DTLS-SRTP, AES-GCM for sealed
        # calls), and not distributed in France. Apple recorded that as needing
        # no documentation and as this key's NO, and says to put it here so
        # that each upload is not asked again. Revisit it if the app is ever
        # offered in France or carries cryptography of its own.
        ITSAppUsesNonExemptEncryption: false
        # Said outright, as the defaults iOS used while they were left out: an
        # upload that runs on the iPad is refused without every orientation
        # (error 90474), because iPad multitasking may give it any of them.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Tomoshibi uses the microphone so that others in a call can hear you.
        NSCameraUsageDescription: Tomoshibi uses the camera so that others in a call can see you.
        NSLocalNetworkUsageDescription: Tomoshibi talks to a meeting server on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A call goes on with the screen locked or another app in front, as a
        # telephone call does; a browser tab cannot, which is half of why the
        # app exists. Audio alone carries it: voip is for an app woken by
        # PushKit, which this is not, and a review asks what it is for.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: app.tomoshibi.link
            CFBundleURLSchemes: [tomoshibi]
    entitlements:
      path: build/Tomoshibi-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Tomoshibi
        TARGETED_DEVICE_FAMILY: "1,2"
  # The iPhone's screen, captured by ReplayKit and handed to the app over the
  # app group (TomoshibiBasics/BroadcastWire.swift). It links TomoshibiBasics
  # alone: an extension has fifty megabytes, and the core does not fit.
  Tomoshibi-Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    dependencies:
      - package: TomoshibiKit
        product: TomoshibiBasics
    info:
      path: build/Info-Broadcast.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        # From the build settings, so the version is said in one place: left
        # out, XcodeGen wrote 1.0 (1) whatever MARKETING_VERSION said, and an
        # extension whose version differs from its app's is refused upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: build/Tomoshibi-Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios.broadcast
        PRODUCT_NAME: TomoshibiBroadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  TomoshibiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tomoshibi-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios.uitests
        TEST_TARGET_NAME: Tomoshibi-iOS
        GENERATE_INFOPLIST_FILE: YES

# XcodeGen describes the project; the .xcodeproj is generated and not kept.
#   cd apple && xcodegen
name: Tomoshibi
options:
  bundleIdPrefix: app.tomoshibi
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  TomoshibiCore:
    path: TomoshibiCore
  TomoshibiKit:
    path: TomoshibiKit
settings:
  base:
    DEVELOPMENT_TEAM: SM86NB3CPZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    OTHER_LDFLAGS: ["-ObjC"]
    # The core is built for Apple silicon only (the Mac, phones, and the
    # simulator on Apple silicon); an Intel simulator slice does not exist.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Tomoshibi-macOS:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TomoshibiKit
    info:
      path: build/Info-macOS.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        NSMicrophoneUsageDescription: Tomoshibi uses the microphone so that others in a call can hear you.
        NSCameraUsageDescription: Tomoshibi uses the camera so that others in a call can see you.
        CFBundleURLTypes:
          - CFBundleURLName: app.tomoshibi.link
            CFBundleURLSchemes: [tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.mac
        PRODUCT_NAME: Tomoshibi
  Tomoshibi-iOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TomoshibiKit
      - target: Tomoshibi-Broadcast
    info:
      path: build/Info-iOS.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Tomoshibi uses the microphone so that others in a call can hear you.
        NSCameraUsageDescription: Tomoshibi uses the camera so that others in a call can see you.
        NSLocalNetworkUsageDescription: Tomoshibi talks to a meeting server on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A call goes on with the screen locked or another app in front, as a
        # telephone call does; a browser tab cannot, which is half of why the
        # app exists.
        UIBackgroundModes: [audio, voip]
        CFBundleURLTypes:
          - CFBundleURLName: app.tomoshibi.link
            CFBundleURLSchemes: [tomoshibi]
    entitlements:
      path: build/Tomoshibi-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios
        PRODUCT_NAME: Tomoshibi
        TARGETED_DEVICE_FAMILY: "1,2"
  # The iPhone's screen, captured by ReplayKit and handed to the app over the
  # app group (TomoshibiBasics/BroadcastWire.swift). It links TomoshibiBasics
  # alone: an extension has fifty megabytes, and the core does not fit.
  Tomoshibi-Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    dependencies:
      - package: TomoshibiKit
        product: TomoshibiBasics
    info:
      path: build/Info-Broadcast.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: build/Tomoshibi-Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios.broadcast
        PRODUCT_NAME: TomoshibiBroadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

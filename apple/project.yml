# XcodeGen describes the project; the .xcodeproj is generated and not kept.
#   cd apple && xcodegen
name: Tomoshibi
options:
  bundleIdPrefix: app.tomoshibi
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  # The Mac's Debug entitlements: the Release ones without the associated
  # domain (see the Mac target), written beside them every time the project
  # is, so the camera and the microphone are declared in one place.
  postGenCommand: >-
    cp build/Tomoshibi-macOS.entitlements build/Tomoshibi-macOS-Debug.entitlements &&
    /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" build/Tomoshibi-macOS-Debug.entitlements
packages:
  TomoshibiCore:
    path: TomoshibiCore
  TomoshibiKit:
    path: TomoshibiKit
# TOMOSHIBI_HOST, the deployment the apps are built for (Deployment.xcconfig).
configFiles:
  Debug: Deployment.xcconfig
  Release: Deployment.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: SM86NB3CPZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    OTHER_LDFLAGS: ["-ObjC"]
    # The core is built for Apple silicon only (the Mac, phones, and the
    # simulator on Apple silicon); an Intel simulator slice does not exist.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Tomoshibi-macOS:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TomoshibiKit
    info:
      path: build/Info-macOS.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        # From the build settings, so the version is said in one place: left
        # out, XcodeGen wrote 1.0 (1) whatever MARKETING_VERSION said, and an
        # extension whose version differs from its app's is refused upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The four languages the interface is written in, declared so the
        # system offers a per-app language for Tomoshibi in its settings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        NSMicrophoneUsageDescription: Tomoshibi uses the microphone so that others in a call can hear you.
        NSCameraUsageDescription: Tomoshibi uses the camera so that others in a call can see you.
        CFBundleURLTypes:
          - CFBundleURLName: app.tomoshibi.link
            CFBundleURLSchemes: [tomoshibi]
    # The hardened runtime, which notarization asks of an app given out
    # outside the App Store, and the two devices it would otherwise keep from
    # the app: under the hardened runtime a camera or microphone not declared
    # here gives nothing, silently. The screen needs no entitlement (it asks
    # for Screen Recording itself), and nothing here is loaded from a library
    # signed by anybody else.
    #
    # And the deployment's universal links: an invitation or a meeting's link
    # (https://<the deployment>/?invite=T#/room) opens in the app, once the
    # deployment's apple-app-site-association names SM86NB3CPZ.app.tomoshibi.mac.
    # Release only. On the Mac this entitlement needs a provisioning profile
    # that grants it, and a Debug build is signed with the development
    # certificate and no profile: with it, every Debug build stopped at "No
    # profiles for 'app.tomoshibi.mac' were found" unless xcodebuild was
    # allowed to make one, which no test script is. A Debug build is pointed
    # at a local deployment anyway, and one that claimed the real domain's
    # links would open them in a test build.
    entitlements:
      path: build/Tomoshibi-macOS.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.developer.associated-domains: ["applinks:$(TOMOSHIBI_HOST)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.mac
        PRODUCT_NAME: Tomoshibi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Conditional, because XcodeGen writes CODE_SIGN_ENTITLEMENTS for every
        # configuration over whatever a configuration of the target says.
        "CODE_SIGN_ENTITLEMENTS[config=Debug]": build/Tomoshibi-macOS-Debug.entitlements
  Tomoshibi-iOS:
    type: application
    platform: iOS
    scheme:
      testTargets: [TomoshibiUITests]
    sources: [App]
    dependencies:
      - package: TomoshibiKit
      - target: Tomoshibi-Broadcast
      - target: Tomoshibi-Messages
    info:
      path: build/Info-iOS.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        # From the build settings, so the version is said in one place: left
        # out, XcodeGen wrote 1.0 (1) whatever MARKETING_VERSION said, and an
        # extension whose version differs from its app's is refused upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The four languages the interface is written in, declared so the
        # system offers a per-app language for Tomoshibi in its settings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        UILaunchScreen: {}
        # The export compliance answer, given once in App Store Connect for
        # build 1: standard algorithms only (TLS, DTLS-SRTP, AES-GCM for sealed
        # calls), and not distributed in France. Apple recorded that as needing
        # no documentation and as this key's NO, and says to put it here so
        # that each upload is not asked again. Revisit it if the app is ever
        # offered in France or carries cryptography of its own.
        ITSAppUsesNonExemptEncryption: false
        # Said outright, as the defaults iOS used while they were left out: an
        # upload that runs on the iPad is refused without every orientation
        # (error 90474), because iPad multitasking may give it any of them.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Tomoshibi uses the microphone so that others in a call can hear you.
        NSCameraUsageDescription: Tomoshibi uses the camera so that others in a call can see you.
        NSLocalNetworkUsageDescription: Tomoshibi talks to a meeting server on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A call goes on with the screen locked or another app in front, as a
        # telephone call does; a browser tab cannot, which is half of why the
        # app exists. Audio alone carries it: voip is for an app woken by
        # PushKit, which this is not, and a review asks what it is for.
        UIBackgroundModes: [audio]
        # The camera's own effects from Control Center, which iOS applies by
        # default only to apps with the voip mode: without it "Blur my
        # background" opened the system's video effects and the blur never
        # reached the call. Portrait (the blur) and Studio Light are asked for;
        # the gesture reactions are not, since the call has reactions of its
        # own and a hand raised to speak set off fireworks (AVCaptureDevice.h).
        NSCameraPortraitEffectEnabled: true
        NSCameraStudioLightEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: app.tomoshibi.link
            CFBundleURLSchemes: [tomoshibi]
    # The app group the broadcast extension hands the screen over in, and the
    # deployment's universal links (see the Mac target): the association file
    # names SM86NB3CPZ.app.tomoshibi.ios. Debug as well as Release here: the
    # simulator needs no profile for it, and a build for a phone is signed
    # with a profile in either configuration, which has to grant it.
    entitlements:
      path: build/Tomoshibi-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tomoshibi]
        com.apple.developer.associated-domains: ["applinks:$(TOMOSHIBI_HOST)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Tomoshibi
        TARGETED_DEVICE_FAMILY: "1,2"
  # The iPhone's screen, captured by ReplayKit and handed to the app over the
  # app group (TomoshibiBasics/BroadcastWire.swift). It links TomoshibiBasics
  # alone: an extension has fifty megabytes, and the core does not fit.
  Tomoshibi-Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    dependencies:
      - package: TomoshibiKit
        product: TomoshibiBasics
    info:
      path: build/Info-Broadcast.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        # From the build settings, so the version is said in one place: left
        # out, XcodeGen wrote 1.0 (1) whatever MARKETING_VERSION said, and an
        # extension whose version differs from its app's is refused upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: build/Tomoshibi-Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios.broadcast
        PRODUCT_NAME: TomoshibiBroadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # Invitations from Messages (Messages/MessagesViewController.swift): a
  # meeting started for now or one already arranged, sent as a card whose link
  # is the web's own, and a card pressed open into the meeting. TomoshibiBasics
  # alone, as the broadcast extension has it, and the app's glass compiled in
  # from its file rather than linked with TomoshibiKit, which carries the core.
  # It reads the account the app leaves in the app group (Handover), and the
  # deployment's host from the build, as TomoshibiHost in its Info.plist.
  Tomoshibi-Messages:
    type: app-extension.messages
    platform: iOS
    sources:
      - Messages
      - TomoshibiKit/Sources/TomoshibiKit/UI/Glass.swift
    dependencies:
      - package: TomoshibiKit
        product: TomoshibiBasics
      - sdk: Messages.framework
    info:
      path: build/Info-Messages.plist
      properties:
        CFBundleDisplayName: Tomoshibi
        # From the build settings, so the version is said in one place: an
        # extension whose version differs from its app's is refused upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        TomoshibiHost: $(TOMOSHIBI_HOST)
        # A debug build is pointed at a deployment on loopback, over http, as
        # the app is.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    entitlements:
      path: build/Tomoshibi-Messages.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tomoshibi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios.messages
        PRODUCT_NAME: TomoshibiMessages
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
  TomoshibiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tomoshibi-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tomoshibi.ios.uitests
        TEST_TARGET_NAME: Tomoshibi-iOS
        GENERATE_INFOPLIST_FILE: YES
